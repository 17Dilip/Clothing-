<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest - Fashion Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

<!-- NAVBAR -->
<nav class="bg-white shadow sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-black">STYLE<span class="text-pink-600">NEST</span></h1>
    <div class="hidden md:flex gap-6 font-medium">
      <a href="#">MEN</a><a href="#">WOMEN</a><a href="#">KIDS</a><a href="#">SALE</a>
    </div>
    <div class="flex items-center gap-4">
      <div class="relative"><i class="fa fa-search"></i><input id="search" placeholder="Search" class="border rounded-full px-3 py-1 ml-2 text-sm"></div>
      <button id="userBtn" onclick="openAuth()" class="text-xl"><i class="fa fa-user"></i> <span id="userName" class="text-sm"></span></button>
      <button onclick="openCart()" class="relative text-xl"><i class="fa fa-bag-shopping"></i><span id="cartCount" class="absolute -top-2 -right-2 bg-pink-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span></button>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="bg-black text-white text-center py-16 px-4">
  <h2 class="text-5xl font-black mb-4">FLAT 50% OFF</h2>
  <p class="text-xl mb-6">New Winter Collection - Limited Time</p>
  <button onclick="document.getElementById('products').scrollIntoView()" class="bg-white text-black px-8 py-3 font-bold rounded-full">SHOP NOW</button>
</div>

<!-- CATEGORIES -->
<div class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-3 md:grid-cols-6 gap-4">
  <div class="bg-white p-4 rounded-xl text-center shadow"><p>👕</p><p class="font-bold mt-2">T-Shirts</p></div>
  <div class="bg-white p-4 rounded-xl text-center shadow"><p>👖</p><p class="font-bold mt-2">Jeans</p></div>
  <div class="bg-white p-4 rounded-xl text-center shadow"><p>🥻</p><p class="font-bold mt-2">Sarees</p></div>
  <div class="bg-white p-4 rounded-xl text-center shadow"><p>👘</p><p class="font-bold mt-2">Kurtas</p></div>
  <div class="bg-white p-4 rounded-xl text-center shadow"><p>🧥</p><p class="font-bold mt-2">Jackets</p></div>
  <div class="bg-white p-4 rounded-xl text-center shadow"><p>👚</p><p class="font-bold mt-2">Hoodies</p></div>
</div>

<!-- PRODUCTS -->
<div id="products" class="max-w-7xl mx-auto px-4 py-8">
  <h3 class="text-2xl font-bold mb-6">Trending Now</h3>
  <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>

<!-- CART DRAWER -->
<div id="cartDrawer" class="fixed top-0 right-0 w-96 h-full bg-white shadow-2xl z-[60] translate-x-full transition p-6 flex flex-col">
  <div class="flex justify-between mb-4"><h3 class="font-bold text-xl">Your Bag</h3><button onclick="closeCart()"><i class="fa fa-xmark"></i></button></div>
  <div id="cartItems" class="flex-1 overflow-y-auto space-y-3"></div>
  <div class="border-t pt-4">
    <div class="flex justify-between font-bold text-lg"><span>Total</span><span id="cartTotal">₹0</span></div>
    <button onclick="openCheckout()" class="w-full bg-black text-white py-3 mt-4 rounded-full font-bold">CHECKOUT</button>
  </div>
</div>

<!-- CHECKOUT -->
<div id="checkoutPage" class="fixed inset-0 bg-gray-50 z-[70] hidden overflow-y-auto">
  <div class="max-w-4xl mx-auto p-6">
    <button onclick="closeCheckout()" class="mb-4"><i class="fa fa-arrow-left"></i> Back</button>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-bold mb-4">Delivery Address</h3>
        <input id="cName" placeholder="Full Name" class="w-full border p-2 rounded mb-2">
        <input id="cPhone" placeholder="Phone" class="w-full border p-2 rounded mb-2">
        <input id="cAddr" placeholder="Full Address" class="w-full border p-2 rounded mb-2">
        <input id="cPin" placeholder="Pincode" class="w-full border p-2 rounded mb-2">
      </div>
      <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-bold mb-4">Payment Option</h3>
        <label class="flex gap-2 border p-3 rounded mb-2"><input type="radio" name="pay" value="COD" checked onchange="togglePay()"> <span><b>Cash on Delivery (COD)</b> - Pay at doorstep</span></label>
        <label class="flex gap-2 border p-3 rounded mb-2"><input type="radio" name="pay" value="ONLINE" onchange="togglePay()"> <span><b>Online Payment</b></span></label>
        <div id="onlineBox" class="hidden border p-3 rounded bg-gray-50">
          <select id="onlineType" class="w-full border p-2 rounded mb-2" onchange="toggleOnlineSub()">
            <option value="UPI">UPI</option><option value="CARD">Credit/Debit Card</option><option value="NET">Net Banking</option>
          </select>
          <div id="upiBox"><input placeholder="Enter UPI ID (e.g. name@upi)" class="w-full border p-2 rounded"></div>
          <div id="cardBox" class="hidden"><input placeholder="Card Number" class="w-full border p-2 rounded mb-2"><div class="flex gap-2"><input placeholder="MM/YY" class="w-1/2 border p-2 rounded"><input placeholder="CVV" class="w-1/2 border p-2 rounded"></div></div>
          <div id="netBox" class="hidden"><select class="w-full border p-2 rounded"><option>HDFC</option><option>SBI</option><option>ICICI</option></select></div>
        </div>
        <button onclick="placeOrder()" class="w-full bg-pink-600 text-white py-3 mt-4 rounded-full font-bold">PLACE ORDER</button>
      </div>
    </div>
  </div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="fixed inset-0 bg-black/50 z-[80] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl w-full max-w-sm p-6">
    <div class="flex justify-between mb-4"><h3 id="authTitle" class="font-bold text-xl">Login</h3><button onclick="closeAuth()"><i class="fa fa-xmark"></i></button></div>
    <div id="signupExtra" class="hidden"><input id="sName" placeholder="Full Name" class="w-full border p-2 rounded mb-2"></div>
    <input id="sEmail" placeholder="Email" class="w-full border p-2 rounded mb-2">
    <input id="sPass" type="password" placeholder="Password" class="w-full border p-2 rounded mb-4">
    <button onclick="doAuth()" class="w-full bg-black text-white py-2 rounded-full font-bold">Continue</button>
    <p class="text-center mt-3 text-sm"><span id="authSwitchText">No account?</span> <button onclick="switchAuth()" id="authSwitchBtn" class="text-pink-600 font-bold">Create one</button></p>
    <p id="authMsg" class="text-center text-sm text-red-600 mt-2"></p>
  </div>
</div>

<!-- SUCCESS -->
<div id="successPage" class="fixed inset-0 bg-white z-[90] hidden flex items-center justify-center p-6 text-center">
  <div><h2 class="text-4xl">🎉</h2><h2 class="text-3xl font-black mt-2">Order Placed!</h2><p id="orderDetails" class="mt-4"></p><button onclick="location.reload()" class="mt-6 bg-black text-white px-8 py-2 rounded-full">Continue Shopping</button></div>
</div>

<script>
const products = [
{id:1,name:"Oversized T-Shirt",price:599,orig:999,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",cat:"T-Shirts"},
{id:2,name:"Slim Fit Jeans",price:1299,orig:1999,img:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400",cat:"Jeans"},
{id:3,name:"Banarasi Saree",price:2499,orig:3999,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400",cat:"Sarees"},
{id:4,name:"Cotton Kurta",price:899,orig:1499,img:"https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=400",cat:"Kurtas"},
{id:5,name:"Winter Jacket",price:1999,orig:3499,img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400",cat:"Jackets"},
{id:6,name:"Hoodie Black",price:1099,orig:1799,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400",cat:"Hoodies"},
{id:7,name:"Linen Shirt",price:799,orig:1299,img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400",cat:"T-Shirts"},
{id:8,name:"Wide Leg Jeans",price:1399,orig:2199,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=400",cat:"Jeans"},
];
let cart=[], currentUser=JSON.parse(localStorage.getItem('currentUser')||'null'), authMode='login';
function renderProducts(list=products){
  document.getElementById('productGrid').innerHTML=list.map(p=>`
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <img src="${p.img}" class="w-full h-56 object-cover">
      <div class="p-3"><p class="text-sm text-gray-500">${p.cat}</p><p class="font-bold">${p.name}</p><p><span class="font-black">₹${p.price}</span> <span class="line-through text-gray-400 text-sm">₹${p.orig}</span> <span class="text-green-600 text-sm">${Math.round((p.orig-p.price)/p.orig*100)}% OFF</span></p><button onclick="addToCart(${p.id})" class="w-full mt-2 border border-black py-1 rounded-full font-bold text-sm">ADD TO BAG</button></div>
    </div>`).join('');
}
function addToCart(id){ const p=products.find(x=>x.id===id); const c=cart.find(x=>x.id===id); if(c) c.qty++; else cart.push({...p,qty:1}); updateCart(); openCart(); }
function updateCart(){ document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0); let total=cart.reduce((s,i)=>s+i.price*i.qty,0); document.getElementById('cartTotal').innerText='₹'+total; document.getElementById('cartItems').innerHTML=cart.map(i=>`<div class="flex gap-2 border p-2 rounded"><img src="${i.img}" class="w-12 h-12 object-cover rounded"><div class="flex-1"><p class="text-sm font-bold">${i.name}</p><p class="text-sm">₹${i.price} x ${i.qty}</p></div><button onclick="removeCart(${i.id})" class="text-red-500"><i class="fa fa-trash"></i></button></div>`).join('')||'<p class="text-center text-gray-400">Bag is empty</p>'; }
function removeCart(id){ cart=cart.filter(x=>x.id!==id); updateCart(); }
function openCart(){ document.getElementById('cartDrawer').classList.remove('translate-x-full'); } function closeCart(){ document.getElementById('cartDrawer').classList.add('translate-x-full'); }
function openCheckout(){ if(cart.length===0) return alert('Cart empty'); if(!currentUser) return openAuth(); document.getElementById('checkoutPage').classList.remove('hidden'); closeCart(); }
function closeCheckout(){ document.getElementById('checkoutPage').classList.add('hidden'); }
function togglePay(){ const v=document.querySelector('input[name="pay"]:checked').value; document.getElementById('onlineBox').classList.toggle('hidden', v!=='ONLINE'); }
function toggleOnlineSub(){ const v=document.getElementById('onlineType').value; document.getElementById('upiBox').classList.toggle('hidden', v!=='UPI'); document.getElementById('cardBox').classList.toggle('hidden', v!=='CARD'); document.getElementById('netBox').classList.toggle('hidden', v!=='NET'); }
function placeOrder(){ const name=document.getElementById('cName').value; if(!name) return alert('Enter address'); const pay=document.querySelector('input[name="pay"]:checked').value; const total=document.getElementById('cartTotal').innerText; const orderId='ORD'+Date.now(); document.getElementById('successPage').classList.remove('hidden'); document.getElementById('orderDetails').innerHTML=`Order ID: <b>${orderId}</b><br>Payment: <b>${pay}</b><br>Total: <b>${total}</b><br>Will be delivered to ${name}`; cart=[]; updateCart(); closeCheckout(); }

// AUTH
function openAuth(){ document.getElementById('authModal').classList.remove('hidden'); updateAuthUI(); } function closeAuth(){ document.getElementById('authModal').classList.add('hidden'); }
function switchAuth(){ authMode=authMode==='login'?'signup':'login'; updateAuthUI(); }
function updateAuthUI(){ document.getElementById('authTitle').innerText=authMode==='login'?'Login':'Create Account'; document.getElementById('signupExtra').classList.toggle('hidden', authMode==='login'); document.getElementById('authSwitchText').innerText=authMode==='login'?'No account?':'Have account?'; document.getElementById('authSwitchBtn').innerText=authMode==='login'?'Create one':'Login'; }
function doAuth(){ const email=document.getElementById('sEmail').value, pass=document.getElementById('sPass').value, name=document.getElementById('sName').value; if(!email||!pass) return document.getElementById('authMsg').innerText='Enter email & password'; let users=JSON.parse(localStorage.getItem('users')||'[]'); if(authMode==='signup'){ if(users.find(u=>u.email===email)) return document.getElementById('authMsg').innerText='Email already exists'; users.push({email,pass,name}); localStorage.setItem('users',JSON.stringify(users)); currentUser={email,name}; } else { const u=users.find(u=>u.email===email&&u.pass===pass); if(!u) return document.getElementById('authMsg').innerText='Invalid login'; currentUser=u; } localStorage.setItem('currentUser',JSON.stringify(currentUser)); document.getElementById('userName').innerText=currentUser.name||currentUser.email.split('@')[0]; closeAuth(); }
function checkUser(){ if(currentUser) document.getElementById('userName').innerText=currentUser.name||currentUser.email.split('@')[0]; }
document.getElementById('search').addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); renderProducts(products.filter(p=>p.name.toLowerCase().includes(q))); });
renderProducts(); updateCart(); checkUser();
</script>
</body>
</html>
